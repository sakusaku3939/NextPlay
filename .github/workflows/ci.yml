name: Rails checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test
      PARALLEL_WORKERS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          bundler-cache: true
      - name: Prepare test database
        run: bin/rails db:prepare
      - name: Check autoloading
        run: bin/rails zeitwerk:check
      - name: Audit locked dependencies
        run: bundle exec bundler-audit check --update
      - name: Run tests
        run: bin/rails test
      - name: Run browser smoke tests
        run: bin/rails test:system
      - name: Compile production assets without credentials
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
          BUNDLE_WITHOUT: development:test
        run: bin/rails assets:precompile
      - name: Boot production with the compiled asset manifest
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
          BUNDLE_WITHOUT: development:test
        run: bin/rails runner 'puts "Rails #{Rails.version}"; puts ActionCable.server.pubsub.class.name'
